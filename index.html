<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JobWinner — Onboarding funnel prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;600;700&display=swap');

:root{
  --jw-blue:#007AFF; --jw-blue-hover:#0062D6; --jw-tint:#EAF3FD;
  --jw-ink:#02112D; --jw-slate:#656F83; --jw-terracotta:#DE8F6E;
  --jw-cloud:#F5F9FD; --jw-line:#E3E9F2;
  --jw-success:#88AB75; --jw-success-bg:#F3F7EE; --jw-gold:#F2C037;
  --r-btn:10px; --r-card:16px;
  --shadow:0 1px 2px rgba(2,17,45,.05), 0 8px 24px rgba(2,17,45,.05);
  --pjs:'Plus Jakarta Sans',sans-serif; --inter:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{min-height:100%;font-family:var(--inter);color:var(--jw-ink);background:var(--jw-cloud)}
#shell{width:100%;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:var(--shadow)}

/* ============ header ============ */
header{padding:12px 20px 0;position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);z-index:20;border-bottom:1px solid var(--jw-line)}
.hdr-row{display:flex;align-items:center;gap:8px;min-height:40px}
#backBtn{width:40px;height:40px;border:1.5px solid #B9C9DE;background:#fff;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--jw-ink);flex:none;transition:all .15s;box-shadow:0 1px 4px rgba(2,17,45,.08)}
#backBtn:hover{background:var(--jw-tint);border-color:var(--jw-blue);transform:translateX(-1px)}
#backBtn.hidden{visibility:hidden}
.logo-wrap{flex:1;display:flex;justify-content:center}
.logo-wrap img{height:27px;width:auto;display:block}
#langBtn{flex:none;border:1px solid var(--jw-line);background:#fff;border-radius:20px;padding:7px 12px;font-family:var(--inter);font-weight:700;font-size:12px;color:var(--jw-slate);cursor:pointer;transition:all .15s}
#langBtn:hover{border-color:var(--jw-blue);color:var(--jw-blue)}
#langBtn b{color:var(--jw-blue)}
#progWrap{padding:12px 0 8px}
#phaseLabel{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#9AA5B5;text-align:center;margin-top:8px}
#progress{display:flex;gap:5px}
#progress .seg{flex:1;height:6px;border-radius:3px;background:var(--jw-line);overflow:hidden}
#progress .seg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--jw-blue),#4DA3FF);border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ============ layout ============ */
main{flex:1;display:flex;flex-direction:column;padding:20px 24px 8px;overflow-y:auto}
.wrap{width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;flex:1}
.screen{display:flex;flex-direction:column;flex:1;animation:slideIn .3s cubic-bezier(.2,.8,.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
footer{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,#fff 26%);padding:14px 24px calc(16px + env(safe-area-inset-bottom));z-index:15}
footer .finner{width:100%;max-width:600px;margin:0 auto}
footer:empty{display:none}
h1{font-family:var(--pjs);font-weight:800;font-size:24px;line-height:1.28;letter-spacing:-.02em;margin-bottom:6px}
.subtitle{color:var(--jw-slate);font-size:15.5px;line-height:1.55;margin-bottom:18px}
.qtitle{text-align:center}
.qsub{text-align:center}
.options{margin-top:14px !important}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--jw-blue);margin-bottom:10px}
.illo{display:flex;justify-content:center;margin:10px 0 22px}
.illo svg{max-width:100%;height:auto}

/* ============ options ============ */
.options{display:flex;flex-direction:column;gap:10px;margin:6px 0 10px}
.opt{background:#fff;border:1.5px solid var(--jw-line);border-radius:var(--r-card);padding:13px 14px;font-size:15.5px;font-weight:600;color:var(--jw-ink);cursor:pointer;text-align:left;display:flex;align-items:center;gap:13px;transition:border-color .15s, background .15s, box-shadow .15s, transform .15s;font-family:var(--inter);line-height:1.35}
.opt:active{transform:scale(.985)}
@media (hover:hover){
  .opt:hover{border-color:var(--jw-blue);background:#F8FBFF;box-shadow:0 4px 14px rgba(0,122,255,.14);transform:translateY(-2px)}
  .opt:hover .duo{transform:scale(1.08)}
}
.opt .duo{width:44px;height:44px;flex:none;transition:transform .18s}
.opt .duo svg{width:100%;height:100%}
.opt .lbl{flex:1}
.opt .mark{width:22px;height:22px;border:2px solid var(--jw-line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .15s}
.opt .mark svg{width:13px;height:13px;opacity:0}
.opt.radio .mark{border-radius:50%}
.opt.checkbox .mark{border-radius:7px}
.opt.sel{border-color:var(--jw-blue);background:#F5FAFF;box-shadow:0 0 0 3px rgba(0,122,255,.12)}
.opt.sel .mark{background:var(--jw-blue);border-color:var(--jw-blue)}
.opt.sel .mark svg{opacity:1}

/* ============ buttons ============ */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border:none;border-radius:var(--r-btn);font-family:var(--inter);font-weight:700;font-size:15px;letter-spacing:.04em;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--jw-blue);color:#fff;box-shadow:0 6px 16px rgba(0,122,255,.28)}
.btn-primary svg{width:17px;height:17px}
.btn-primary:hover{background:var(--jw-blue-hover);box-shadow:0 8px 20px rgba(0,122,255,.36)}
.btn-primary:disabled{background:var(--jw-line);color:var(--jw-slate);cursor:not-allowed;box-shadow:none}
.btn-secondary{background:#fff;color:var(--jw-blue);border:1.5px solid var(--jw-blue)}
.btn-secondary:hover{background:var(--jw-tint)}
.btn-row{display:flex;gap:12px}
.btn-row .btn{flex:1}
.skiplink{background:none;border:none;color:var(--jw-slate);font-size:14px;font-family:var(--inter);text-decoration:underline;cursor:pointer;display:block;margin:14px auto 0}
.footnote{font-size:13px;color:var(--jw-slate);text-align:center;margin-top:10px}

/* ============ interstitial ============ */
.inter{display:flex;flex-direction:column;flex:1;text-align:center;justify-content:center;padding-bottom:10px}
.inter h1{font-size:26px}
.icon-list{display:flex;flex-direction:column;gap:10px;margin:18px 0;text-align:left}
.icon-list .row{display:flex;gap:12px;align-items:center;background:var(--jw-cloud);border:1px solid var(--jw-line);border-radius:12px;padding:12px 14px}
.icon-list .row .ic{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--jw-line);color:var(--jw-blue);display:flex;align-items:center;justify-content:center;flex:none}
.icon-list .row .ic svg{width:22px;height:22px}
.icon-list .row p{font-size:14.5px;line-height:1.45;font-weight:600}

/* ============ relate ============ */
.relate-label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--jw-slate);text-align:center;margin:18px 0 14px}
.quote-card{background:var(--jw-tint);border-radius:var(--r-card);padding:30px 24px;text-align:center;position:relative;margin-bottom:8px}
.quote-card .qico{width:44px;height:44px;border-radius:50%;background:var(--jw-blue);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 6px 14px rgba(0,122,255,.3)}
.quote-card .qico svg{width:20px;height:20px}
.quote-card p{font-family:var(--pjs);font-weight:700;font-size:19px;line-height:1.42}

/* ============ inputs ============ */
.input-wrap{position:relative;margin:6px 0 14px}
input[type=text],input[type=number],input[type=email]{width:100%;padding:16px;font-size:16px;font-family:var(--inter);border:1.5px solid var(--jw-line);border-radius:12px;color:var(--jw-ink);outline:none;background:#fff;transition:all .15s}
input:focus{border-color:var(--jw-blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
.currency{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--jw-slate);font-weight:700}
.toggle{display:flex;background:var(--jw-cloud);border:1px solid var(--jw-line);border-radius:var(--r-btn);padding:4px;gap:4px;margin-bottom:14px}
.toggle button{flex:1;padding:10px;border:none;border-radius:8px;background:transparent;font-family:var(--inter);font-weight:700;font-size:13.5px;color:var(--jw-slate);cursor:pointer;transition:all .15s}
.toggle button.on{background:#fff;color:var(--jw-blue);box-shadow:var(--shadow)}
.microcopy{font-size:13px;color:var(--jw-slate);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.microcopy svg{width:14px;height:14px;flex:none;color:var(--jw-blue)}

/* ============ loader ============ */
.loader-wrap{display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center;text-align:center;max-width:480px;margin:0 auto;width:100%}
.ring-box{position:relative;width:150px;height:150px;margin:16px 0 24px}
.ring-box svg{transform:rotate(-90deg)}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--pjs);font-weight:800;font-size:32px}
.check-list{display:flex;flex-direction:column;gap:9px;width:100%;text-align:left;margin-bottom:20px}
.check-list .ci{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--jw-slate);font-weight:600;opacity:.4;transition:all .3s}
.check-list .ci.done{opacity:1;color:var(--jw-ink)}
.check-list .ci .mk{width:20px;height:20px;border-radius:50%;background:var(--jw-line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .3s}
.check-list .ci .mk svg{width:11px;height:11px}
.check-list .ci.done .mk{background:var(--jw-success)}
.review-rot{background:var(--jw-cloud);border:1px solid var(--jw-line);border-radius:12px;padding:13px 15px;font-size:13.5px;color:var(--jw-slate);width:100%;min-height:64px;line-height:1.5}
.review-rot b{color:var(--jw-ink)}
.stars{color:var(--jw-gold);letter-spacing:2px}
.micro-q{position:fixed;inset:0;background:rgba(2,17,45,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.micro-card{background:#fff;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:480px;animation:slideUp .3s cubic-bezier(.2,.8,.3,1)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.micro-card .tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--jw-blue);margin-bottom:8px}
.micro-card h2{font-family:var(--pjs);font-weight:800;font-size:20px;margin-bottom:18px;line-height:1.3}

/* ============ result ============ */
.result-hero{text-align:center;margin-bottom:20px}
.result-hero .big{font-family:var(--pjs);font-weight:800;font-size:44px;color:var(--jw-blue);line-height:1.05}
.result-cols{display:flex;flex-direction:column;gap:0}
.card{border:1px solid var(--jw-line);border-radius:var(--r-card);padding:18px 20px;margin-bottom:16px;background:#fff;box-shadow:var(--shadow)}
.card h3{font-family:var(--pjs);font-weight:800;font-size:16.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 svg{width:18px;height:18px;color:var(--jw-blue)}
.tl-item{display:flex;gap:14px;position:relative;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--jw-line)}
.tl-item:last-child::before{display:none}
.tl-dot{width:24px;height:24px;border-radius:50%;background:var(--jw-tint);border:2px solid var(--jw-blue);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--jw-blue);font-weight:700}
.tl-dot svg{width:12px;height:12px}
.tl-item.gold .tl-dot{background:#FEF7E3;border-color:var(--jw-gold);color:#B78A0A}
.tl-txt b{display:block;font-size:14.5px}
.tl-txt span{font-size:13px;color:var(--jw-slate)}
.pc-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--jw-line);font-size:14px}
.pc-row:last-child{border-bottom:none}
.pc-row .k{color:var(--jw-slate);flex:none}
.pc-row .v{font-weight:600;text-align:right}

/* ============ paywall ============ */
.pw-banner{position:sticky;top:0;z-index:30;background:var(--jw-ink);color:#fff;padding:10px 16px}
.pw-inner{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pw-banner .t{font-size:12.5px;font-weight:600;line-height:1.35}
.pw-banner .t b{color:var(--jw-gold);font-family:var(--pjs);font-size:15px}
.pw-banner button{background:var(--jw-blue);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:12px;letter-spacing:.05em;cursor:pointer;font-family:var(--inter);flex:none}
.pw-banner button:hover{background:var(--jw-blue-hover)}
.pw-body{padding:18px 24px 8px;max-width:600px;margin:0 auto;width:100%}
.plans{display:flex;flex-direction:column;gap:14px;margin:16px 0}
.plan{position:relative;background:#fff;border:1.5px solid var(--jw-line);border-radius:var(--r-card);padding:16px;cursor:pointer;display:flex;align-items:center;gap:13px;transition:all .15s}
@media (hover:hover){.plan:hover{border-color:var(--jw-blue);box-shadow:0 4px 14px rgba(0,122,255,.14);transform:translateY(-2px)}}
.plan.sel{border-color:var(--jw-blue);background:#F5FAFF;box-shadow:0 0 0 3px rgba(0,122,255,.12)}
.plan .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--jw-line);flex:none;transition:all .15s}
.plan.sel .radio{border:7px solid var(--jw-blue)}
.plan-name{font-family:var(--pjs);font-weight:800;font-size:15.5px}
.plan-old{color:var(--jw-slate);text-decoration:line-through;font-size:12.5px}
.chip{display:inline-block;background:var(--jw-success-bg);color:#5B7A4B;font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 8px;margin-left:6px}
.plan-day{margin-left:auto;text-align:right}
.plan-day .n{font-family:var(--pjs);font-weight:800;font-size:24px;line-height:1}
.plan-day .u{font-size:11.5px;color:var(--jw-slate)}
.pop-pill{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--jw-blue);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.06em;border-radius:20px;padding:4px 12px;text-transform:uppercase;white-space:nowrap}
.billing-note{font-size:15.5px;font-weight:600;text-align:center;background:var(--jw-tint);border-radius:12px;padding:13px;margin-bottom:14px;line-height:1.45}
.pw-section{margin:24px 0}
.pw-section h3{font-family:var(--pjs);font-weight:800;font-size:18px;margin-bottom:12px}
.feat{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14.5px;line-height:1.45}
.feat .ck{width:20px;height:20px;border-radius:50%;background:var(--jw-success-bg);color:var(--jw-success);display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.feat .ck svg{width:11px;height:11px}
.press{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;opacity:.5}
.press span{font-family:var(--pjs);font-weight:800;font-size:15px;color:var(--jw-slate)}
.rev-grid{display:flex;flex-direction:column;gap:10px}
.rev-card{background:var(--jw-cloud);border:1px solid var(--jw-line);border-radius:12px;padding:13px 15px;font-size:13.5px;line-height:1.5}
.rev-card .who{color:var(--jw-slate);font-size:12.5px;margin-top:6px}
.stripe-badge{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--jw-slate);font-size:12.5px;margin:12px 0 6px;flex-wrap:wrap}
.stripe-badge .sb{background:#635BFF;color:#fff;font-weight:700;font-style:italic;border-radius:4px;padding:2px 8px;font-size:12.5px}

/* ============ success ============ */
.success-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center}
.mock-note{font-size:12.5px;color:var(--jw-slate);background:var(--jw-cloud);border:1px dashed var(--jw-line);border-radius:10px;padding:10px 14px;margin-top:18px}

/* ============ compare infographic ============ */
.compare{display:flex;gap:12px;margin:18px 0;text-align:left}
.compare .col{flex:1;background:#fff;border:1px solid var(--jw-line);border-radius:var(--r-card);padding:13px}
.compare .col.jw{border:1.5px solid var(--jw-blue);box-shadow:0 0 0 3px rgba(0,122,255,.1)}
.compare h4{font-family:var(--pjs);font-size:12px;font-weight:800;margin-bottom:11px;text-align:center}
.compare .col.jw h4{color:var(--jw-blue)}
.bar-row{margin-bottom:9px}
.bar-row .pct{font-size:10.5px;font-weight:700;color:var(--jw-slate);margin-bottom:3px;display:block}
.bar{height:7px;border-radius:4px;background:var(--jw-line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:#B9C3D4}
.col.jw .bar i{background:var(--jw-blue)}
.col.jw .bar-row .pct{color:var(--jw-blue)}

/* ============ responsive: small phones ============ */
@media (max-width:380px){
  h1{font-size:22px}
  .inter h1{font-size:23px}
  main{padding:16px 18px 8px}
  footer{padding-left:18px;padding-right:18px}
  header{padding:12px 16px 0}
}

/* ============ responsive: tablet & desktop ============ */
@media (min-width:700px){
  body{padding:32px 20px}
  #shell{max-width:860px;min-height:calc(100vh - 64px);border-radius:24px;border:1px solid var(--jw-line);overflow:hidden}
  header{padding:16px 40px 0}
  .logo-wrap img{height:31px}
  #progWrap{max-width:600px;margin:0 auto}
  main{padding:34px 40px 8px}
  footer{padding:16px 40px 22px}
  h1{font-size:30px}
  .inter h1{font-size:32px}
  .subtitle{font-size:17px}
  .quote-card{padding:38px 32px}
  .quote-card p{font-size:22px}
  .btn-row{max-width:440px;margin:0 auto;width:100%}
  .relate-foot{display:flex;justify-content:center}
  .micro-card{border-radius:20px;margin-bottom:10vh}
  .micro-q{align-items:center}
  .result-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .result-cols .card{margin-bottom:0}
  .pw-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
  .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .plan{flex-direction:column;align-items:flex-start;gap:8px;padding:20px 18px 16px}
  .plan.sel{padding:20px 18px 16px}
  .plan .radio{position:absolute;top:16px;right:16px}
  .plan-day{margin-left:0;text-align:left;margin-top:4px}
  .plan-day .n{font-size:30px}
  .rev-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .compare{gap:16px}
  .compare h4{font-size:13.5px}
  .loader-wrap h1{font-size:24px}
}
</style>
</head>
<body>
<div id="shell">
  <header id="hdr">
    <div class="hdr-row">
      <button id="backBtn" aria-label="Back">

const idx = id => S.findIndex(s=>s.id===id);
let currentI = 0;

/* ============ navigation & branches ============ */
function nextIndex(i){
  let n = i+1;
  while(S[n] && S[n].cond && !S[n].cond()) n++;
  return n;
}
function go(i){ state.history.push(currentI); currentI=i; render(); }
function next(){ go(nextIndex(currentI)); }
function back(){
  if(!state.history.length) return;
  let prev = state.history.pop();
  if(S[prev] && S[prev].type==='loader'){ prev = state.history.pop(); }
  currentI = prev; render();
}

/* ============ chrome ============ */
const main = document.getElementById('main');
const foot = document.getElementById('foot');
const backBtn = document.getElementById('backBtn');
const langBtn = document.getElementById('langBtn');
backBtn.addEventListener('click', back);
langBtn.addEventListener('click', ()=>{ LANG = LANG==='en'?'es':'en'; render(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ const b=document.getElementById('cont'); if(b && !b.disabled && document.activeElement.tagName!=='BUTTON') b.click(); }
});
let loaderTimer=null, reviewTimer=null, countdownTimer=null;

const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const BTN = {cont:['CONTINUE','Continuar'], yes:['Yes','Sí'], no:['No','No']};

function renderHeader(){
  const s=S[currentI];
  const hide = ['loader','success'].includes(s.type);
  langBtn.innerHTML = LANG==='en' ? '<b>EN</b> · ES' : 'EN · <b>ES</b>';
  document.getElementById('progWrap').style.display = hide||s.type==='paywall' ? 'none':'block';
  if(!hide && s.type!=='paywall'){
    document.getElementById('phaseLabel').textContent = PHASES[s.phase];
    const inPhase = S.filter(x=>x.phase===s.phase);
    const pos = inPhase.findIndex(x=>x.id===s.id);
    document.getElementById('progress').innerHTML = PHASES.map((_,p)=>{
      let w=0;
      if(p<s.phase) w=100; else if(p===s.phase) w=Math.round(((pos+1)/inPhase.length)*100);
      return `<div class="seg"><i style="width:${w}%"></i></div>`;
    }).join('');
  }
  backBtn.classList.toggle('hidden', currentI===0 || hide || s.type==='paywall');
}

function render(){
  clearInterval(loaderTimer); clearInterval(reviewTimer); clearInterval(countdownTimer);
  document.querySelectorAll('.micro-q').forEach(e=>e.remove());
  renderHeader();
  const s=S[currentI];
  main.scrollTop=0; window.scrollTo(0,0);
  foot.innerHTML='';
  ({single:rSingle, multi:rMulti, salary:rSalary, country:rCountry, inter:rInter,
    relate:rRelate, stat:rStat, resume:rResume, compare:rCompare, chart:rChart, loader:rLoader,
    result:rResult, signup:rSignup, paywall:rPaywall, success:rSuccess})[s.type](s);
}
function wrap(html){ return `<div class="wrap"><div class="screen">${html}</div></div>`; }
function footPrimary(label, handler, disabled){
  foot.innerHTML = `<div class="finner"><button class="btn btn-primary" id="cont" ${disabled?'disabled':''}><span>${T(label)}</span>${ic('arrowright')}</button></div>`;
  document.getElementById('cont').addEventListener('click', handler);
}

/* ============ screen types ============ */
function titleOf(s){
  if(s.dynamic==='workAuth'){
    const c = state.answers.P11 || '';
    if(c==='United States') return {t:T(['Are you authorized to work in the US?','¿Estás autorizado para trabajar en EE. UU.?']),sub:'',optional:false};
    if(EU.includes(c)) return {t:T(['Do you have a work permit in the EU?','¿Tienes permiso de trabajo en la UE?']),sub:'',optional:false};
    return {t:T([`Do you have a work permit in ${c||'your target country'}?`,`¿Tienes permiso de trabajo en ${c||'tu país de destino'}?`]),
            sub:T(['Optional — you can skip this one.','Pregunta opcional: puedes saltarla si lo prefieres.']),optional:true};
  }
  return {t:T(s.title),sub:s.sub?T(s.sub):'',optional:false};
}
function optBtn(s,o,k,kind,selected){
  const showIcon = s.icons!==false && o.i;
  return `<button class="opt ${kind}${selected?' sel':''}" data-k="${k}">
    ${showIcon?`<span class="duo">${duo(o.i)}</span>`:''}
    <span class="lbl">${esc(T(o.t))}</span><span class="mark">${ic('check')}</span>
  </button>`;
}

function rSingle(s){
  const {t,sub,optional}=titleOf(s);
  main.innerHTML = wrap(`
    <h1 class="qtitle">${t}</h1>${sub?`<p class="subtitle qsub">${sub}</p>`:''}
    <div class="options">${s.opts.map((o,k)=>optBtn(s,o,k,'radio',state.answers[s.id]===o)).join('')}</div>
    ${optional?`<button class="skiplink" id="skip">${T(['Prefer not to answer','Prefiero no responder'])}</button>`:''}
  `);
  let advancing=false; /* single choice: select = auto-advance, no Continue */
  main.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(advancing) return; advancing=true;
    state.answers[s.id]=s.opts[+b.dataset.k];
    main.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    setTimeout(next,280);
  }));
  const sk=document.getElementById('skip'); if(sk) sk.addEventListener('click',()=>{ if(advancing) return; advancing=true; state.answers[s.id]=null; next();});
}

function rMulti(s){
  state.answers[s.id]=state.answers[s.id]||[];
  const contLabel = ()=>{ const n=state.answers[s.id].length; return T(BTN.cont)+(n?` (${n})`:''); };
  main.innerHTML = wrap(`
    <h1 class="qtitle">${T(s.title)}</h1><p class="subtitle qsub">${T(['Select all that apply.','Elige todas las que apliquen.'])}</p>
    <div class="options">${s.opts.map((o,k)=>optBtn(s,o,k,'checkbox',state.answers[s.id].includes(o))).join('')}</div>
  `);
  footPrimary(contLabel(), ()=>{ if(state.answers[s.id].length) next(); }, !state.answers[s.id].length);
  main.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    const o=s.opts[+b.dataset.k]; const a=state.answers[s.id];
    a.includes(o)?a.splice(a.indexOf(o),1):a.push(o);
    b.classList.toggle('sel');
    const btn=document.getElementById('cont');
    btn.disabled=!a.length;
    btn.querySelector('span').textContent=contLabel();
  }));
}

function rSalary(s){
  const periods=[['Hourly','Por hora'],['Monthly','Mensual'],['Yearly','Anual']];
  main.innerHTML = wrap(`
    <h1>${T(s.title)}</h1><p class="subtitle">${T(s.sub)}</p>
    <div class="toggle">${periods.map((p,k)=>`<button data-p="${k}" class="${state.salaryPeriod===k?'on':''}">${T(p)}</button>`).join('')}</div>
    <div class="input-wrap">
      <input type="number" id="sal" min="0" inputmode="numeric" placeholder="${T(['e.g. 1800','p. ej. 1800'])}" value="${state.answers.P8_amount||''}">
      <span class="currency">EUR</span>
    </div>
  `);
  footPrimary(BTN.cont, ()=>{

function chartSVG(){
  const M=[10,30,49,64,70,80,89], A=[2,5,7,10,20,25,27];
  const X=i=>52+i*44, Y=p=>198-p*1.7;
  const line=(d,c)=>`<polyline points="${d.map((p,i)=>X(i)+','+Y(p)).join(' ')}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  const dots=(d,c)=>d.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p)}" r="3.5" fill="${c}" stroke="#fff" stroke-width="1.5"/>`).join('');
  let grid='',ylab='';
  for(let p=0;p<=100;p+=10){
    grid+=`<line x1="48" y1="${Y(p)}" x2="${X(6)+8}" y2="${Y(p)}" stroke="#EDF1F7" stroke-width="1"/>`;
    ylab+=`<text x="41" y="${Y(p)+3.5}" text-anchor="end" font-size="9.5" fill="#9AA5B5" font-family="Inter,sans-serif">${p}%</text>`;
  }

  const xlab = M.map((_,i)=>`<text x="${X(i)}" y="216" text-anchor="middle" font-size="10" fill="#9AA5B5" font-family="Inter,sans-serif">${i+1}${w}</text>`).join('');
  const membersLbl = T(['JobWinner members','Miembros JobWinner']);
  const avgLbl = T(['Average candidate','Candidato medio']);
  return `<svg viewBox="0 0 360 226" style="width:100%;max-width:430px">
    ${grid}${ylab}${xlab}
    <line x1="48" y1="${Y(90)}" x2="${X(6)+8}" y2="${Y(90)}" stroke="#007AFF" stroke-width="1.5" stroke-dasharray="3 4" opacity=".45"/>
    ${line(A,'#DE8F6E')}${dots(A,'#DE8F6E')}

    <g><rect x="196" y="16" width="152" height="26" rx="13" fill="#007AFF"/><text x="272" y="33" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff" font-family="Inter,sans-serif">${membersLbl}</text></g>
    <g><rect x="204" y="118" width="144" height="26" rx="13" fill="#fff" stroke="#DE8F6E" stroke-width="1.5"/><text x="276" y="135" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C06B45" font-family="Inter,sans-serif">${avgLbl}</text></g>
  </svg>`;
}

/* ============ loader with in-flow micro-questions ============ */
function rLoader(s){
  const checks=[['Categories & Salary','Categorías y Salario'],['Experience','Experiencia'],['Work Preferences','Preferencias de trabajo'],['Location & Remote','Ubicación y Remoto'],['Personal Goals','Objetivos personales']];
  const reviews=[
    ['Michael',["Using AI to automate job applications has saved me countless hours and landed me 12 interviews in three weeks!","Usar IA para automatizar candidaturas me ha ahorrado horas incontables y me consiguió 12 entrevistas en tres semanas."]],
    ['Laura',["I stopped wasting hours on job boards. Two weeks in, I had more responses than in three months on my own.","Dejé de perder horas en portales. En dos semanas tenía más respuestas que en tres meses por mi cuenta."]],
    ['Sergio',["The ATS-optimized resume made the difference. Recruiters finally reply.","El CV optimizado para ATS marcó la diferencia. Por fin contestan."]]
  ];
  const microQs=[
    {at:45,key:'P48a',q:['Open to learn new skills if the role requires it?','¿Abierto a aprender nuevas skills si el rol lo requiere?']},
    {at:78,key:'P48b',q:['Do you have a laptop to work remotely?','¿Tienes un portátil para trabajar en remoto?']}
  ];
  const C=2*Math.PI*66;
  main.innerHTML = `<div class="wrap"><div class="screen"><div class="loader-wrap">
    <h1 style="font-size:20px;text-align:center">${T(s.title)}</h1>
    <div class="ring-box">
      <svg width="150" height="150">
        <circle cx="75" cy="75" r="66" fill="none" stroke="var(--jw-line)" stroke-width="10"/>
        <circle id="ring" cx="75" cy="75" r="66" fill="none" stroke="var(--jw-blue)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset .25s linear"/>
      </svg>
      <div class="ring-pct" id="pct">0%</div>
    </div>
    <div class="check-list">${checks.map((c,k)=>`<div class="ci" id="ci${k}"><span class="mk">${ic('check')}</span>${T(c)}</div>`).join('')}</div>
    <div class="review-rot" id="rev"></div>
  </div></div></div>`;
  let p=0, ri=0, paused=false;
  const asked=new Set();
  const rev=document.getElementById('rev');
  const showRev=()=>{ const [n,q]=reviews[ri%reviews.length]; ri++;
    rev.innerHTML=`<b>${n}</b> ${T(['wrote a review','escribió una reseña'])} &nbsp;<span class="stars">★★★★★</span><br>&ldquo;${T(q)}&rdquo;`; };
  showRev(); reviewTimer=setInterval(showRev,3000);
  const askMicro=(mq)=>{
    paused=true;
    const ov=document.createElement('div');
    ov.className='micro-q';
    ov.innerHTML=`<div class="micro-card">
      <div class="tag">${T(['To move forward, specify','Para avanzar, especifica'])}</div>
      <h2>${T(mq.q)}</h2>
      <div class="btn-row">
        <button class="btn btn-secondary" data-v="No">${T(BTN.no)}</button>
        <button class="btn btn-primary" data-v="Yes">${T(BTN.yes)}</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    ov.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{
      state.answers[mq.key]=b.dataset.v; ov.remove(); paused=false;
    }));
  };
  loaderTimer=setInterval(()=>{
    if(paused) return;
    p=Math.min(100,p+2);
    document.getElementById('pct').textContent=p+'%';
    document.getElementById('ring').style.strokeDashoffset=C*(1-p/100);
    checks.forEach((_,k)=>{ if(p>=(k+1)*19) document.getElementById('ci'+k).classList.add('done'); });
    const mq=microQs.find(m=>p>=m.at && !asked.has(m.key));
    if(mq){ asked.add(mq.key); askMicro(mq); return; }
    if(p>=100){ clearInterval(loaderTimer); clearInterval(reviewTimer); setTimeout(next,600); }
  },110);
}

    <div class="mock-note">${T(['Prototype: simulated payment — no real charge was made.','Prototipo: pago simulado, no se ha realizado ningún cargo real.'])}</div>
  </div>`);
  document.getElementById('restart').addEventListener('click',()=>{
    state.answers={}; state.history=[]; state.selectedPlan=1; state.salaryPeriod=1;
    secondsLeft=9*60+57; currentI=0; render();
  });
}

render();
</script>
</body>
</html>
